# CI for this kit itself: runs the same local checks as `bash scripts/check.sh`,
# plus the imported NightCrew worker tests. Nothing here calls a model provider,
# starts Gitea or touches another repository.
name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Kit checks
        run: bash scripts/check.sh
      - name: NightCrew worker tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest -q integrations/nightcrew/tests/Python/test_gitea_night.py
